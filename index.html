<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4fa">
  <title>Cotton Candy Invaders</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: #493652;
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 12% 18%, #ffe1ed 0, transparent 34%),
        radial-gradient(ellipse at 88% 82%, #dceeff 0, transparent 38%),
        #fff8fc;
    }

    .arcade {
      width: min(100%, 880px);
    }

    .intro {
      margin-bottom: 20px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 8px;
      padding: 6px 12px;
      border: 1px solid #f1d8ee;
      border-radius: 999px;
      color: #84518d;
      background: rgba(255, 255, 255, 0.75);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #583c68;
      font-size: clamp(2rem, 6vw, 3.4rem);
      letter-spacing: -0.05em;
      line-height: 1.05;
    }

    .intro p {
      margin: 10px 0 0;
      color: #806d88;
    }

    .game-frame {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: 0 24px 70px rgba(111, 76, 128, 0.18);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      touch-action: manipulation;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 24px;
      margin: 18px 0 0;
      color: #725d7d;
      font-size: 0.9rem;
    }

    .controls span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    kbd {
      min-width: 27px;
      padding: 4px 7px;
      border: 1px solid #eadced;
      border-bottom-width: 3px;
      border-radius: 7px;
      color: #583c68;
      background: #fff;
      font: 700 0.78rem system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="arcade">
    <header class="intro">
      <p class="eyebrow">A cozy little arcade</p>
      <h1>Cotton Candy Invaders</h1>
      <p>Save the sky, one sweet shot at a time.</p>
    </header>
    <section class="game-frame" aria-label="Game area">
      <canvas id="gameCanvas" width="800" height="600" aria-label="Cotton Candy Invaders game">
        Your browser does not support HTML canvas.
      </canvas>
    </section>
    <nav class="controls" aria-label="Game controls">
      <span>Move <kbd>←</kbd><kbd>→</kbd></span>
      <span>Fire <kbd>Space</kbd></span>
      <span>Retry <kbd>R</kbd></span>
    </nav>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const context = canvas.getContext("2d");
    const backgroundGradient = context.createLinearGradient(
      0,
      0,
      0,
      canvas.height
    );
    backgroundGradient.addColorStop(0, "#bde0fe");
    backgroundGradient.addColorStop(0.55, "#e0c3fc");
    backgroundGradient.addColorStop(1, "#ffc8dd");

    const ship = {
      width: 40,
      height: 20,
      x: (canvas.width - 40) / 2,
      y: canvas.height - 40,
      speed: 300
    };

    const keys = {
      ArrowLeft: false,
      ArrowRight: false,
      Space: false
    };

    const playerBullets = [];
    const enemyBullets = [];
    const particles = [];
    let playerLives = 3;
    let score = 0;
    let gameTime = 0;
    let playerFireCooldown = 0;
    let enemyFireCooldown = 1;
    let playerInvulnerableTime = 0;
    let gameState = "playing";
    const stars = Array.from({ length: 48 }, (_, index) => ({
      x: (index * 137 + 37) % canvas.width,
      y: (index * 83 + 21) % canvas.height,
      radius: index % 3 === 0 ? 1.7 : 1.1,
      phase: index * 0.73
    }));

    const enemyRows = 4;
    const enemyColumns = 10;
    const enemyWidth = 30;
    const enemyHeight = 22;
    const enemyStartX = 130;
    const enemyStartY = 85;
    const enemyColumnSpacing = 54;
    const enemyRowSpacing = 48;
    const enemyColors = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0"];
    const enemies = [];
    let enemyOffset = 0;
    let enemyVerticalOffset = 0;
    let enemyDirection = 1;
    const enemySpeed = 35;
    const enemyDropDistance = enemyRowSpacing;
    const minEnemyOffset = 30 - enemyStartX;
    const maxEnemyOffset =
      canvas.width - 30 -
      (enemyStartX + (enemyColumns - 1) * enemyColumnSpacing + enemyWidth);
    const retryButton = {
      x: (canvas.width - 200) / 2,
      y: canvas.height / 2 + 20,
      width: 200,
      height: 52
    };

    function resetGame() {
      ship.x = (canvas.width - ship.width) / 2;
      playerBullets.length = 0;
      enemyBullets.length = 0;
      particles.length = 0;
      enemies.length = 0;

      for (let row = 0; row < enemyRows; row += 1) {
        for (let column = 0; column < enemyColumns; column += 1) {
          enemies.push({
            x: enemyStartX + column * enemyColumnSpacing,
            y: enemyStartY + row * enemyRowSpacing,
            color: enemyColors[row]
          });
        }
      }

      playerLives = 3;
      score = 0;
      playerFireCooldown = 0;
      enemyFireCooldown = 1;
      playerInvulnerableTime = 0;
      enemyOffset = 0;
      enemyVerticalOffset = 0;
      enemyDirection = 1;
      gameState = "playing";
      keys.ArrowLeft = false;
      keys.ArrowRight = false;
      keys.Space = false;
    }

    resetGame();

    function createBurst(x, y, color) {
      for (let i = 0; i < 12; i += 1) {
        const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.2;
        const speed = 35 + Math.random() * 70;
        const life = 0.45 + Math.random() * 0.25;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          size: 2 + Math.random() * 3,
          life,
          maxLife: life
        });
      }
    }

    window.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "r" && gameState !== "playing") {
        event.preventDefault();
        resetGame();
        return;
      }

      const key = event.code === "Space" ? "Space" : event.key;
      if (key in keys) {
        event.preventDefault();
        keys[key] = true;
      }
    });

    window.addEventListener("keyup", (event) => {
      const key = event.code === "Space" ? "Space" : event.key;
      if (key in keys) {
        event.preventDefault();
        keys[key] = false;
      }
    });

    canvas.addEventListener("click", (event) => {
      if (gameState === "playing") {
        return;
      }

      const bounds = canvas.getBoundingClientRect();
      const x = (event.clientX - bounds.left) * (canvas.width / bounds.width);
      const y = (event.clientY - bounds.top) * (canvas.height / bounds.height);
      if (
        x >= retryButton.x &&
        x <= retryButton.x + retryButton.width &&
        y >= retryButton.y &&
        y <= retryButton.y + retryButton.height
      ) {
        resetGame();
      }
    });

    let previousTime = 0;

    function update(deltaTime) {
      gameTime += deltaTime;
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const particle = particles[i];
        particle.x += particle.vx * deltaTime;
        particle.y += particle.vy * deltaTime;
        particle.vy += 30 * deltaTime;
        particle.life -= deltaTime;
        if (particle.life <= 0) {
          particles.splice(i, 1);
        }
      }

      if (gameState !== "playing") {
        return;
      }

      if (keys.ArrowLeft) {
        ship.x -= ship.speed * deltaTime;
      }
      if (keys.ArrowRight) {
        ship.x += ship.speed * deltaTime;
      }

      ship.x = Math.max(0, Math.min(canvas.width - ship.width, ship.x));

      playerFireCooldown -= deltaTime;
      if (keys.Space && playerFireCooldown <= 0) {
        playerBullets.push({
          x: ship.x + ship.width / 2 - 2,
          y: ship.y,
          width: 4,
          height: 12,
          speed: 420
        });
        playerFireCooldown = 0.3;
      }

      enemyOffset += enemyDirection * enemySpeed * deltaTime;
      if (enemyOffset < minEnemyOffset || enemyOffset > maxEnemyOffset) {
        enemyOffset = Math.max(minEnemyOffset, Math.min(maxEnemyOffset, enemyOffset));
        enemyDirection *= -1;
        enemyVerticalOffset += enemyDropDistance;
      }

      enemyFireCooldown -= deltaTime;
      if (enemies.length > 0 && enemyFireCooldown <= 0) {
        const shooter = enemies[Math.floor(Math.random() * enemies.length)];
        enemyBullets.push({
          x: shooter.x + enemyOffset + enemyWidth / 2 - 2,
          y: shooter.y + enemyVerticalOffset + enemyHeight,
          width: 4,
          height: 12,
          speed: 220
        });
        enemyFireCooldown = 0.8 + Math.random() * 0.8;
      }

      for (let i = playerBullets.length - 1; i >= 0; i -= 1) {
        const bullet = playerBullets[i];
        bullet.y -= bullet.speed * deltaTime;

        const hitIndex = enemies.findIndex((enemy) => {
          const enemyX = enemy.x + enemyOffset;
          const enemyY = enemy.y + enemyVerticalOffset;
          return (
            bullet.x < enemyX + enemyWidth &&
            bullet.x + bullet.width > enemyX &&
            bullet.y < enemyY + enemyHeight &&
            bullet.y + bullet.height > enemyY
          );
        });

        if (hitIndex !== -1) {
          const [destroyedEnemy] = enemies.splice(hitIndex, 1);
          createBurst(
            destroyedEnemy.x + enemyOffset + enemyWidth / 2,
            destroyedEnemy.y + enemyVerticalOffset + enemyHeight / 2,
            destroyedEnemy.color
          );
          score += 100;
          playerBullets.splice(i, 1);
          if (enemies.length === 0) {
            gameState = "won";
            return;
          }
        } else if (bullet.y + bullet.height < 0) {
          playerBullets.splice(i, 1);
        }
      }

      playerInvulnerableTime = Math.max(0, playerInvulnerableTime - deltaTime);
      for (let i = enemyBullets.length - 1; i >= 0; i -= 1) {
        const bullet = enemyBullets[i];
        bullet.y += bullet.speed * deltaTime;

        const hitShip =
          playerInvulnerableTime === 0 &&
          bullet.x < ship.x + ship.width &&
          bullet.x + bullet.width > ship.x &&
          bullet.y < ship.y + ship.height &&
          bullet.y + bullet.height > ship.y;

        if (hitShip) {
          playerLives -= 1;
          playerInvulnerableTime = 1;
          enemyBullets.splice(i, 1);
          if (playerLives === 0) {
            gameState = "lost";
          }
        } else if (bullet.y > canvas.height) {
          enemyBullets.splice(i, 1);
        }
      }
    }

    function drawEnemy(enemy) {
      const x = enemy.x + enemyOffset;
      const y = enemy.y + enemyVerticalOffset;

      context.fillStyle = enemy.color;
      context.fillRect(x + 8, y, 14, 4);
      context.fillRect(x + 4, y + 4, 22, 4);
      context.fillRect(x, y + 8, enemyWidth, 8);
      context.fillRect(x + 4, y + 16, 6, 4);
      context.fillRect(x + 20, y + 16, 6, 4);
      context.fillRect(x + 2, y + 20, 6, 2);
      context.fillRect(x + 22, y + 20, 6, 2);

      context.fillStyle = "black";
      context.fillRect(x + 7, y + 10, 4, 4);
      context.fillRect(x + 19, y + 10, 4, 4);
    }

    function drawPlayer() {
      const x = ship.x;
      const y = ship.y;

      context.fillStyle = "#ffb86b";
      context.beginPath();
      context.moveTo(x + 13, y + 16);
      context.lineTo(x + 18, y + 16);
      context.lineTo(x + 16, y + 22);
      context.closePath();
      context.fill();
      context.beginPath();
      context.moveTo(x + 22, y + 16);
      context.lineTo(x + 27, y + 16);
      context.lineTo(x + 24, y + 22);
      context.closePath();
      context.fill();

      context.fillStyle = "#ffb3c6";
      context.beginPath();
      context.moveTo(x + 20, y + 1);
      context.quadraticCurveTo(x + 26, y + 1, x + 28, y + 9);
      context.lineTo(x + 37, y + 14);
      context.quadraticCurveTo(x + 40, y + 17, x + 37, y + 18);
      context.lineTo(x + 3, y + 18);
      context.quadraticCurveTo(x, y + 17, x + 3, y + 14);
      context.lineTo(x + 12, y + 9);
      context.quadraticCurveTo(x + 14, y + 1, x + 20, y + 1);
      context.closePath();
      context.fill();
      context.strokeStyle = "#fff0f5";
      context.lineWidth = 1.5;
      context.stroke();

      context.strokeStyle = "#ffe66d";
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(x + 20, y + 3);
      context.lineTo(x + 20, y - 1);
      context.stroke();
      context.fillStyle = "#ffe66d";
      context.beginPath();
      context.arc(x + 20, y - 2, 2, 0, Math.PI * 2);
      context.fill();

      context.fillStyle = "#a0e7e5";
      context.beginPath();
      context.ellipse(x + 20, y + 10, 8, 7, 0, 0, Math.PI * 2);
      context.fill();

      context.fillStyle = "#34344a";
      context.beginPath();
      context.arc(x + 17, y + 9, 1.2, 0, Math.PI * 2);
      context.arc(x + 23, y + 9, 1.2, 0, Math.PI * 2);
      context.fill();

      context.fillStyle = "#ff8fab";
      context.beginPath();
      context.arc(x + 14.5, y + 12, 1.5, 0, Math.PI * 2);
      context.arc(x + 25.5, y + 12, 1.5, 0, Math.PI * 2);
      context.fill();

      context.strokeStyle = "#34344a";
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(x + 18.5, y + 12);
      context.quadraticCurveTo(x + 20, y + 14, x + 21.5, y + 12);
      context.stroke();
    }

    function draw() {
      context.fillStyle = backgroundGradient;
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "white";
      stars.forEach((star) => {
        context.globalAlpha =
          0.16 + (Math.sin(gameTime * 2 + star.phase) + 1) * 0.12;
        context.beginPath();
        context.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        context.fill();
      });
      context.globalAlpha = 1;

      enemies.forEach(drawEnemy);

      context.fillStyle = "#ffe66d";
      playerBullets.forEach((bullet) => {
        context.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      });

      context.fillStyle = "#ff8c42";
      enemyBullets.forEach((bullet) => {
        context.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      });

      particles.forEach((particle) => {
        context.fillStyle = particle.color;
        context.globalAlpha = particle.life / particle.maxLife;
        context.fillRect(
          particle.x,
          particle.y,
          particle.size,
          particle.size
        );
      });
      context.globalAlpha = 1;

      drawPlayer();

      context.fillStyle = "#493652";
      context.font = "bold 17px system-ui, sans-serif";
      context.textAlign = "left";
      context.fillText(`SCORE  ${String(score).padStart(6, "0")}`, 20, 30);
      context.textAlign = "center";
      context.fillText(`ALIENS  ${String(enemies.length).padStart(2, "0")}`, canvas.width / 2, 30);
      context.textAlign = "left";
      context.fillText("LIVES", 638, 30);
      for (let i = 0; i < 3; i += 1) {
        context.fillStyle = i < playerLives ? "#ff6b9b" : "rgba(73, 54, 82, 0.18)";
        context.beginPath();
        context.arc(704 + i * 24, 24, 7, 0, Math.PI * 2);
        context.fill();
      }

      if (gameState !== "playing") {
        context.fillStyle = "rgba(0, 0, 0, 0.72)";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "white";
        context.textAlign = "center";
        context.font = "bold 48px sans-serif";
        context.fillText(
          gameState === "won" ? "YOU WIN!" : "GAME OVER",
          canvas.width / 2,
          canvas.height / 2
        );

        context.fillStyle = "#06d6a0";
        context.fillRect(
          retryButton.x,
          retryButton.y,
          retryButton.width,
          retryButton.height
        );
        context.fillStyle = "black";
        context.font = "bold 24px sans-serif";
        context.fillText(
          "Retry",
          canvas.width / 2,
          retryButton.y + 34
        );
        context.fillStyle = "white";
        context.font = "16px sans-serif";
        context.fillText(
          "Press R or click Retry",
          canvas.width / 2,
          retryButton.y + retryButton.height + 30
        );
      }

      context.fillStyle =
        gameState === "playing" ? "rgba(73, 54, 82, 0.7)" : "rgba(255, 255, 255, 0.85)";
      context.font = "12px system-ui, sans-serif";
      context.textAlign = "right";
      context.fillText(
        "done by e65q - chu yi xuan",
        canvas.width - 16,
        canvas.height - 12
      );
    }

    function animate(currentTime) {
      const deltaTime = (currentTime - previousTime) / 1000;
      previousTime = currentTime;

      update(deltaTime);
      draw();
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
